[project]
name = "finrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bing02114", email = "1017257504@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "torch==2.8.0",
]

[project.scripts]
finrag = "finrag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
agent = [
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]
documents = [
    "beautifulsoup4>=4.15.0",
    "pymupdf>=2.1",
]
embedding = [
    "sentence-transformers>=6.2.0",
]
llm = [
    "google-genai>=3.0.0",
    "openai>=3.46.0",
]
reranking = [
    "flagembedding>=1.4.2",
]
retrieval = [
    "jieba>=0.42.1",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
]
